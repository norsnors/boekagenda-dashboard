name: Cijferagenda bijwerken

on:
  schedule:
    # Vangnet. GitHub start deze in de praktijk uren te laat (okt 2026: 7-8 uur); de
    # ochtendronde komt van de Cron Triggers op de Cloudflare Worker (worker/README.md).
    # GitHub cron draait in UTC. Runs zijn idempotent.
    - cron: "0 4 * * 1-5"
    - cron: "0 5 * * 1-5"
  workflow_dispatch: {}   # handmatig starten via de Actions-tab
  push:                   # meteen verversen na een wijziging in de lijst of de fetcher
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-agenda.yml"

permissions:
  contents: write

concurrency:
  group: update-agenda
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch agenda
        run: python scripts/fetch_agenda.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/agenda.json docs/data/changelog.json
          if git diff --cached --quiet; then
            echo "Geen wijzigingen in de agenda."
          else
            git commit -m "chore: cijferagenda bijgewerkt ($(date -u +%Y-%m-%d))"
            # Twee runs vlak na elkaar (wekker + GitHub-schema) kunnen botsen: eerst
            # bijwerken; bij een conflict in de data wint deze (nieuwste) run.
            git pull --rebase -X theirs origin main
            git push
          fi
